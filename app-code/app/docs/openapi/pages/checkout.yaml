openapi: 3.1.0
info:
  title: Checkout Page Contract
  version: 1.0.0
  description: |
    Public checkout page contract for the storefront.
    The page is rendered as HTML and injects `window.app_params` for the client-side checkout logic.

    The checkout form currently sends selection data to:
    - `GET /{locale}/checkout/cities`
    - `POST /{locale}/checkout/branches`
    - `POST /{locale}/checkout/selection`
    - `POST /{locale}/order-validate/simple`
    - `POST /{locale}/order-confirm/simple`

    The singleton Pickup module can add the `pickup_store` delivery method when it is
    enabled and configured. See [Pickup module contract](../../../Modules/Pickup/docs/openapi.yaml).

    WayForPay is a singleton payment method rendered inside `#checkout-payment-collapse`.
    When selected, it is processed through the `SimpleOrder` endpoints. The create response
    contains either official widget data or a POST redirect payload; the WayForPay module's
    frontend entry point loads the widget only after order validation and creation have
    succeeded. See [WayForPay module contract](../../../Modules/WayForPay/docs/openapi.yaml).
servers:
  - url: https://example.test
    description: Local or staging environment
tags:
  - name: Checkout
    description: Checkout page and search endpoints
paths:
  /{locale}/checkout:
    get:
      tags: [Checkout]
      summary: Render checkout page
      parameters:
        - in: path
          name: locale
          required: true
          schema:
            type: string
          description: Active storefront locale.
      responses:
        '200':
          description: Rendered checkout page.
          content:
            text/html:
              schema:
                type: string
  /{locale}/checkout/cities:
    get:
      tags: [Checkout]
      summary: Search cities by keyword
      parameters:
        - in: path
          name: locale
          required: true
          schema:
            type: string
        - in: query
          name: city_keyword
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: Partial city name typed by the customer.
      responses:
        '200':
          description: Search result list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutCitiesResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /{locale}/checkout/branches:
    post:
      tags: [Checkout]
      summary: Search delivery points for the selected city and method
      parameters:
        - in: path
          name: locale
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutBranchSearchRequest'
      responses:
        '200':
          description: Delivery point list for the selected delivery method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutBranchesResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /{locale}/checkout/selection:
    post:
      tags: [Checkout]
      summary: Store checkout selection state
      description: |
        Stores the customer's current checkout form state in the server-side session.
        The state is returned in the response and is also injected into the next checkout
        page render, so the browser can restore customer fields, the selected delivery and
        payment methods, the city, the delivery point, the courier address, the comment,
        the promo code, and the `no_call` checkbox after a page reload or a later visit.

        The payload is intentionally partial: fields may be omitted while the customer is
        completing the form. The endpoint normalizes text values, lowercases delivery and
        payment method identifiers, converts city coordinates to numbers, and keeps only
        the supported delivery-point fields.
      parameters:
        - in: path
          name: locale
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutSelectionStoreRequest'
      responses:
        '200':
          description: Persisted checkout state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSelectionStoreResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /{locale}/order-validate/simple:
    post:
      tags: [Checkout]
      summary: Validate a regular checkout order
      description: Validates customer, delivery, payment, and cart data before an order is created.
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimpleOrderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SimpleOrderRequest'
      responses:
        '200':
          description: Validation result and current cart snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderValidationResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /{locale}/order-confirm/simple:
    post:
      tags: [Checkout]
      summary: Create a regular checkout order
      description: |
        Creates the regular order. For `payment_method=wayforpay`, the response remains
        pending and includes a payment payload. The browser then opens the widget or submits
        the fallback redirect form to `https://secure.wayforpay.com/pay`.
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimpleOrderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SimpleOrderRequest'
      responses:
        '200':
          description: Order creation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleOrderResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  parameters:
    Locale:
      in: path
      name: locale
      required: true
      schema:
        type: string
      description: Active storefront locale.
  responses:
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
  schemas:
    ValidationErrorResponse:
      type: object
      additionalProperties: true
      required: [message]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    CheckoutCitiesResponse:
      type: object
      additionalProperties: false
      required: [success, locale, items]
      properties:
        success:
          type: boolean
        locale:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutCityItem'
    CheckoutCityItem:
      type: object
      additionalProperties: true
      required:
        - city_description
        - nova_poshta_city_id
        - ukr_poshta_city_id
      properties:
        city_description:
          type: string
          description: Human-readable city name used by the checkout city selector.
        nova_poshta_city_id:
          type: string
          description: Nova Poshta city reference.
        ukr_poshta_city_id:
          type: integer
          description: Ukr Poshta city identifier.
        city_lat:
          type:
            - number
            - 'null'
        city_lng:
          type:
            - number
            - 'null'
    CheckoutBranchSearchRequest:
      type: object
      additionalProperties: false
      required: [delivery_method, city]
      properties:
        delivery_method:
          type: string
          enum:
            - nova_poshta
            - nova_poshta_poshtomat
            - nova_poshta_courier
            - ukr_poshta
          description: Selected delivery method from the checkout page.
        city:
          type: object
          additionalProperties: true
          required: [city_description]
          properties:
            city_description:
              type: string
            nova_poshta_city_id:
              type:
                - string
                - 'null'
            ukr_poshta_city_id:
              type:
                - integer
                - 'null'
            city_lat:
              type:
                - number
                - 'null'
            city_lng:
              type:
                - number
                - 'null'
    CheckoutBranchesResponse:
      type: object
      additionalProperties: false
      required: [success, locale, items]
      properties:
        success:
          type: boolean
        locale:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutDeliveryPointItem'
    CheckoutDeliveryPointItem:
      type: object
      additionalProperties: true
      required: [description]
      properties:
        id:
          type:
            - integer
            - string
        branch_value:
          type:
            - string
            - 'null'
          description: Value written to the select option for the branch selector.
        label:
          type:
            - string
            - 'null'
          description: Human-readable label shown to the customer.
        ref:
          type:
            - string
            - 'null'
        postcode:
          type:
            - integer
            - string
            - 'null'
        description:
          type: string
        city_ref:
          type:
            - string
            - 'null'
        poregion_id:
          type:
            - integer
            - 'null'
        podistrict_id:
          type:
            - integer
            - 'null'
        pdcity_id:
          type:
            - integer
            - 'null'
        latitude:
          type:
            - string
            - 'null'
        longitude:
          type:
            - string
            - 'null'
        number:
          type:
            - integer
            - 'null'
        site_key:
          type:
            - integer
            - 'null'
        region_ua:
          type:
            - string
            - 'null'
        district_ua:
          type:
            - string
            - 'null'
        postreet_id:
          type:
            - string
            - 'null'
        schedule:
          type:
            - string
            - 'null'
          description: Localized schedule string for Nova Poshta points, prepared for storefront rendering by ShippingScheduleFormatter.
        delivery_method:
          type:
            - string
            - 'null'
    CheckoutSelectionStoreRequest:
      type: object
      additionalProperties: false
      description: |
        Partial checkout state payload. Send this payload after a customer changes a
        delivery/payment selection or edits a form field. Customer fields are optional here
        because the order is validated separately by `POST /{locale}/order-validate/simple`.
      properties:
        delivery_method:
          oneOf:
            - type: string
              enum:
                - nova_poshta
                - nova_poshta_poshtomat
                - nova_poshta_courier
                - ukr_poshta
                - pickup_store
            - type: 'null'
        city:
          type:
            - object
            - 'null'
          additionalProperties: true
          properties:
            city_description:
              type:
                - string
                - 'null'
            nova_poshta_city_id:
              type:
                - string
                - 'null'
            ukr_poshta_city_id:
              type:
                - integer
                - 'null'
            city_lat:
              type:
                - number
                - 'null'
            city_lng:
              type:
                - number
                - 'null'
        delivery_point:
          type:
            - object
            - 'null'
          additionalProperties: true
        delivery_address:
          type:
            - string
            - 'null'
          maxLength: 255
          description: For pickup_store, the localized store address is submitted here; for other methods it contains the courier address or null.
        first_name:
          type:
            - string
            - 'null'
          maxLength: 255
          description: Customer first name to restore in the checkout form.
        last_name:
          type:
            - string
            - 'null'
          maxLength: 255
          description: Customer last name to restore in the checkout form.
        phone:
          type:
            - string
            - 'null'
          maxLength: 30
          description: Customer phone number to restore in the checkout form.
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 255
          description: Customer email to restore in the checkout form.
        comment:
          type:
            - string
            - 'null'
          maxLength: 5000
          description: Customer order comment to restore in the checkout form.
        promo_code:
          type:
            - string
            - 'null'
          maxLength: 255
          description: Entered promo code to restore in the checkout form.
        no_call:
          type:
            - boolean
            - 'null'
          description: Whether the customer selected “Do not call to confirm the order”.
    SimpleOrderRequest:
      type: object
      additionalProperties: false
      required:
        - first_name
        - last_name
        - phone
        - email
        - cart_mode
        - delivery_method
        - payment_method
      properties:
        first_name:
          type: string
          minLength: 2
          maxLength: 255
        last_name:
          type: string
          minLength: 2
          maxLength: 255
        phone:
          type: string
          minLength: 10
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 255
        cart_mode:
          type: string
          const: regular
        delivery_method:
          type: string
          enum:
            - nova_poshta
            - nova_poshta_poshtomat
            - nova_poshta_courier
            - ukr_poshta
            - pickup_store
        payment_method:
          type: string
          enum:
            - cash_on_delivery
            - payment_upon_delivery
            - bank_transfer
            - wayforpay
        delivery_address:
          type:
            - string
            - 'null'
          maxLength: 255
        city:
          type:
            - object
            - 'null'
        delivery_point:
          type:
            - object
            - 'null'
    OrderValidationResponse:
      type: object
      additionalProperties: true
      required: [success, errors]
      properties:
        success:
          type: boolean
        errors:
          type: object
          additionalProperties: true
        cart:
          type: object
          additionalProperties: true
    SimpleOrderResponse:
      type: object
      additionalProperties: true
      required: [success, status, errors]
      properties:
        success:
          type: boolean
        order_number:
          type:
            - string
            - 'null'
        status:
          type: string
          enum: [pending, success, failed]
        redirect_url:
          type: string
          format: uri
        errors:
          type: object
          additionalProperties: true
        payment:
          $ref: '#/components/schemas/WayForPayPaymentResponse'
    WayForPayPaymentResponse:
      type: object
      additionalProperties: false
      required: [success, payment_method, use_widget, errors]
      properties:
        success:
          type: boolean
        payment_method:
          type: string
          const: wayforpay
        use_widget:
          type: boolean
        widget_data:
          type: object
          additionalProperties: true
          description: Signed data passed to the official WayForPay widget.
        redirect_data:
          type: object
          additionalProperties: false
          required: [action, method, fields]
          properties:
            action:
              type: string
              format: uri
              const: https://secure.wayforpay.com/pay
            method:
              type: string
              const: POST
            fields:
              type: object
              additionalProperties: true
        errors:
          type: object
          additionalProperties: true
    CheckoutSelectionStoreResponse:
      type: object
      additionalProperties: false
      required: [success, state]
      properties:
        success:
          type: boolean
        state:
          $ref: '#/components/schemas/CheckoutSelectionState'
    CheckoutSelectionState:
      type: object
      additionalProperties: false
      required:
        - delivery_method
        - payment_method
        - city
        - delivery_point
        - delivery_address
        - first_name
        - last_name
        - phone
        - email
        - comment
        - promo_code
        - no_call
      description: |
        Normalized checkout state persisted in the server-side session. This object is
        returned by the selection endpoint and supplied to the checkout page for form
        repopulation. Empty selections are represented by empty strings, `false`, or `{}`.
      properties:
        delivery_method:
          type: string
          description: Selected delivery method identifier, or an empty string.
        payment_method:
          type: string
          description: Selected payment method identifier, or an empty string.
        city:
          type: object
          additionalProperties: true
          description: Normalized selected city data, or an empty object.
          properties:
            city_description:
              type: string
            nova_poshta_city_id:
              type: string
            ukr_poshta_city_id:
              type: integer
            city_lat:
              type: number
            city_lng:
              type: number
        delivery_point:
          type: object
          additionalProperties: true
          description: Normalized branch, parcel locker, or post office data, or an empty object.
        delivery_address:
          type: string
          description: Courier or pickup store address, or an empty string.
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        email:
          type: string
        comment:
          type: string
        promo_code:
          type: string
        no_call:
          type: boolean
