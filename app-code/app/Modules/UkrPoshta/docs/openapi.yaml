openapi: 3.1.0
info:
  title: UkrPoshta Module API
  version: 1.0.0
  description: |
    Public checkout API for the UkrPoshta module.
    The module returns raw JSON rows and server-rendered HTML fragments for storefront selectors.
servers:
  - url: https://example.test
    description: Local or staging environment
tags:
  - name: UkrPoshta
    description: Checkout state and delivery point selection endpoints
paths:
  /ukrposhta/state:
    get:
      tags: [UkrPoshta]
      summary: Get checkout state from session
      responses:
        '200':
          description: Checkout state payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStateResponse'
  /ukrposhta/regions:
    get:
      tags: [UkrPoshta]
      summary: Get available regions
      description: Returns the region directory as JSON items plus a server-rendered HTML fragment.
      responses:
        '200':
          description: Regions list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionsResponse'
  /ukrposhta/districts:
    get:
      tags: [UkrPoshta]
      summary: Get districts for a selected region
      parameters:
        - in: query
          name: region_id
          required: true
          description: Local region identifier stored in the database.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Districts list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistrictsResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /ukrposhta/cities:
    get:
      tags: [UkrPoshta]
      summary: Get cities for a selected district
      parameters:
        - in: query
          name: district_id
          required: true
          description: Local district identifier stored in the database.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Cities list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitiesResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /ukrposhta/post-offices:
    get:
      tags: [UkrPoshta]
      summary: Get post offices for a selected district or city
      description: |
        The module prefers `city_id` when it is available and falls back to `district_id`.
        Only unlocked post offices (`lock_code = 0`) are returned.
      parameters:
        - in: query
          name: district_id
          required: false
          description: Local district identifier stored in the database.
          schema:
            type: integer
            minimum: 1
        - in: query
          name: city_id
          required: false
          description: Local city identifier stored in the database.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Post offices list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostOfficesResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /ukrposhta/selection:
    post:
      tags: [UkrPoshta]
      summary: Save checkout selection state
      description: Stores the current delivery method, region, district, city, and delivery point in the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutSelectionRequest'
      responses:
        '200':
          description: Stored checkout state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStateResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  responses:
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
  schemas:
    ValidationErrorResponse:
      type: object
      additionalProperties: true
      required: [message]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    CheckoutStateResponse:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/UkrPoshtaCheckoutState'
    CheckoutSelectionRequest:
      type: object
      additionalProperties: false
      properties:
        delivery_method:
          oneOf:
            - $ref: '#/components/schemas/DeliveryMethod'
            - type: 'null'
        region:
          oneOf:
            - $ref: '#/components/schemas/UkrPoshtaRegion'
            - type: object
              additionalProperties: true
          nullable: true
        district:
          oneOf:
            - $ref: '#/components/schemas/UkrPoshtaDistrict'
            - type: object
              additionalProperties: true
          nullable: true
        city:
          oneOf:
            - $ref: '#/components/schemas/UkrPoshtaCity'
            - type: object
              additionalProperties: true
          nullable: true
        delivery_point:
          oneOf:
            - $ref: '#/components/schemas/UkrPoshtaDeliveryPoint'
            - type: object
              additionalProperties: true
          nullable: true
    UkrPoshtaCheckoutState:
      type: object
      additionalProperties: false
      properties:
        delivery_method:
          $ref: '#/components/schemas/DeliveryMethod'
        region:
          oneOf:
            - $ref: '#/components/schemas/UkrPoshtaRegion'
            - type: array
              maxItems: 0
          description: Selected region, or an empty array when nothing is selected.
        district:
          oneOf:
            - $ref: '#/components/schemas/UkrPoshtaDistrict'
            - type: array
              maxItems: 0
          description: Selected district, or an empty array when nothing is selected.
        city:
          oneOf:
            - $ref: '#/components/schemas/UkrPoshtaCity'
            - type: array
              maxItems: 0
          description: Selected city, or an empty array when nothing is selected.
        delivery_point:
          oneOf:
            - $ref: '#/components/schemas/UkrPoshtaDeliveryPoint'
            - type: array
              maxItems: 0
          description: Selected delivery point, or an empty array when nothing is selected.
      required: [delivery_method, region, district, city, delivery_point]
    DeliveryMethod:
      type: string
      description: Normalized delivery method slug stored in the session.
      example: post_office
      enum:
        - post_office
        - courier
        - ''
    UkrPoshtaRegion:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
          description: Database ID.
        region_id:
          type: integer
          description: Upstream region identifier.
        region_ua:
          type: string
          description: Ukrainian region name.
      required: [id, region_id, region_ua]
    UkrPoshtaDistrict:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        ukr_poshta_region_id:
          type: integer
        district_id:
          type: integer
        region_ua:
          type: string
        district_ua:
          type: string
      required:
        - id
        - ukr_poshta_region_id
        - district_id
        - region_ua
        - district_ua
    UkrPoshtaCity:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        ukr_poshta_region_id:
          type: integer
        ukr_poshta_district_id:
          type: integer
        city_id:
          type: integer
        description:
          type: string
        city_ua:
          type: string
      required:
        - id
        - ukr_poshta_region_id
        - ukr_poshta_district_id
        - city_id
        - description
    UkrPoshtaDeliveryPoint:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        pdcity_id:
          type:
            - integer
            - 'null'
        podistrict_id:
          type:
            - integer
            - 'null'
        description:
          type: string
        postcode:
          type:
            - integer
            - string
            - 'null'
        lock_code:
          type:
            - integer
            - 'null'
        latitude:
          type:
            - string
            - 'null'
        longitude:
          type:
            - string
            - 'null'
    RegionsResponse:
      type: object
      additionalProperties: false
      required: [items, html]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UkrPoshtaRegion'
        html:
          type: string
          description: Server-rendered fragment for the storefront selector.
    DistrictsResponse:
      type: object
      additionalProperties: false
      required: [items, html]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UkrPoshtaDistrict'
        html:
          type: string
    CitiesResponse:
      type: object
      additionalProperties: false
      required: [items, html]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UkrPoshtaCity'
        html:
          type: string
    PostOfficesResponse:
      type: object
      additionalProperties: false
      required: [items, html]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UkrPoshtaDeliveryPoint'
        html:
          type: string
