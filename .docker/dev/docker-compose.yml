name: "dev-syvak"
services:
  dev-syvak-php-fpm:
    build:
      context: $PWD
      dockerfile: .docker/dev/php/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
    image: dev-syvak-php-fpm:1.0
    container_name: dev-syvak-php-fpm
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.mariadb
    volumes:
      - ../../httpdocs/app:/var/www/app
      - ../../httpdocs/httpdocs:/var/www/html
      - ../../httpdocs/storage:/var/www/storage
      - ../../.docker/dev/php/php.ini:/usr/local/etc/php/php.ini:ro
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      - dev-syvak-mariadb
    networks:
      - dev-syvak-net
      - buggregator-net
      - traefik-network

  dev-syvak-cron:
    build:
      context: $PWD
      dockerfile: .docker/dev/cron/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
    image: dev-syvak-cron:1.0-alpine
    container_name: dev-syvak-cron
    restart: unless-stopped
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.mariadb
    volumes:
      - ../../httpdocs/app:/var/www/app:ro
      - ../../httpdocs/httpdocs:/var/www/html:ro
      - ../../httpdocs/storage:/var/www/storage:ro
      - ../../.docker/dev/cron/crontabs:/etc/crontabs
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      - dev-syvak-php-fpm
      - dev-syvak-mariadb
    networks:
      - dev-syvak-net
      - buggregator-net

  dev-syvak-nginx:
    build:
      context: $PWD
      dockerfile: .docker/dev/nginx/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
    image: dev-syvak-nginx:1.0-alpine
    container_name: dev-syvak-nginx
    env_file:
      - ../../.docker/dev/env/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dev-syvak-nginx.rule=Host(`dev.syvak.com`)"
      - "traefik.http.routers.dev-syvak-nginx.entrypoints=web"
      - "traefik.http.services.dev-syvak-nginx.loadbalancer.server.port=80"
    volumes:
      - ../../httpdocs/app:/var/www/app:ro
      - ../../httpdocs/httpdocs:/var/www/html:ro
      - ../../httpdocs/storage:/var/www/storage:ro
      - ../../.docker/dev/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      - dev-syvak-php-fpm
    networks:
      - traefik-network
      - dev-syvak-net

  dev-syvak-mariadb:
    build:
      context: $PWD
      dockerfile: .docker/dev/mariadb/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
    image: dev-syvak-mariadb:1.0
    container_name: dev-syvak-mariadb
    ports:
      - "3340:3306"
    restart: no
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.mariadb
    volumes:
      - ../../.db:/var/lib/mysql
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    networks:
      - dev-syvak-net

networks:
  traefik-network:
    name: traefik-network
    driver: bridge
    external: true
  dev-syvak-net:
    name: dev-syvak-net
    driver: bridge
    external: true
  buggregator-net:
    name: buggregator-net
    driver: bridge
    external: true