name: "syvak"

services:
  dev-syvak-php-fpm:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/php/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: www-data
    image: dev-syvak-php-fpm:1.0
    container_name: dev-syvak-php-fpm
    restart: unless-stopped
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.mariadb
    volumes:
      - ../../app-code/app:/var/webroot/sites/syvak.com/app
      - ../../app-code/httpdocs:/var/webroot/sites/syvak.com/httpdocs
      - ../../app-code/storage:/var/webroot/sites/syvak.com/storage
      - ../../app-code/xhprof:/var/webroot/sites/syvak.com/xhprof
      - ../../.docker/dev/php/php.ini:/usr/local/etc/php/php.ini:ro
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      dev-syvak-mariadb:
        condition: service_healthy
    networks:
      - dev-syvak-net

  dev-syvak-cron:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/cron/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: www-data
    image: dev-syvak-cron:1.0-alpine
    container_name: dev-syvak-cron
    restart: unless-stopped
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.mariadb
    volumes:
      - ../../app-code/app:/var/webroot/sites/syvak.com/app:ro
      - ../../app-code/httpdocs:/var/webroot/sites/syvak.com/httpdocs:ro
      - ../../app-code/storage:/var/webroot/sites/syvak.com/storage
      - ../../.docker/dev/cron/crontabs:/etc/crontabs
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      dev-syvak-php-fpm:
        condition: service_started
      dev-syvak-mariadb:
        condition: service_healthy
    networks:
      - dev-syvak-net

  dev-syvak-nginx:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/nginx/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: www-data
    image: dev-syvak-nginx:1.0-alpine-slim
    container_name: dev-syvak-nginx
    restart: unless-stopped
    env_file:
      - ../../.docker/dev/env/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dev-syvak-nginx.rule=Host(`dev.syvak.com`)"
      - "traefik.http.routers.dev-syvak-nginx.entrypoints=web"
      - "traefik.http.services.dev-syvak-nginx.loadbalancer.server.port=80"
    volumes:
      - ../../app-code/app:/var/webroot/sites/syvak.com/app:ro
      - ../../app-code/httpdocs:/var/webroot/sites/syvak.com/httpdocs:ro
      - ../../app-code/storage:/var/webroot/sites/syvak.com/storage:ro
      - ../../.docker/dev/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      - dev-syvak-php-fpm
    networks:
      - traefik-network
      - dev-syvak-net

  dev-syvak-mariadb:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/mariadb/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: mysql
    image: dev-syvak-mariadb:1.0
    container_name: dev-syvak-mariadb
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "3340:3306"
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.mariadb
    volumes:
      - ../../.db/mariadb:/var/lib/mysql
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    networks:
      - dev-syvak-net

networks:
  traefik-network:
    name: traefik-network
    driver: bridge
    external: true
  dev-syvak-net:
    name: dev-syvak-net
    driver: bridge
    external: true