name: "syvak"

services:
  dev-syvak-php-fpm:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/php/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: www-data
    image: dev-syvak-php-fpm:1.0
    container_name: dev-syvak-php-fpm
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.mariadb
    environment:
      QUEUE_CONNECTION: redis
      REDIS_HOST: dev-syvak-redis
      REDIS_QUEUE_CONNECTION: default
      REDIS_QUEUE: default
      ORDER_NOTIFICATIONS_KAFKA_TOPIC: order-notifications
      ORDER_NOTIFICATIONS_KAFKA_CONSUMER_GROUP: order-notifications
    volumes:
      - ../../app-code/app:/var/webroot/sites/ttter.syvak.com/app
      - ../../app-code/httpdocs:/var/webroot/sites/ttter.syvak.com/httpdocs
      - ../../app-code/storage:/var/webroot/sites/ttter.syvak.com/storage
      - ../../app-code/xhprof:/var/webroot/sites/ttter.syvak.com/xhprof
      - ../../.docker/dev/php/php.ini:/usr/local/etc/php/php.ini:ro
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      dev-syvak-mariadb:
        condition: service_healthy
      dev-syvak-redis:
        condition: service_healthy
      dev-syvak-kafka:
        condition: service_healthy
    networks:
      - dev-syvak-net

  dev-syvak-cron:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/cron/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: www-data
    image: dev-syvak-cron:1.0-alpine
    container_name: dev-syvak-cron
    restart: unless-stopped
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.mariadb
    volumes:
      - ../../app-code/app:/var/webroot/sites/ttter.syvak.com/app:ro
      - ../../app-code/httpdocs:/var/webroot/sites/ttter.syvak.com/httpdocs:ro
      - ../../app-code/storage:/var/webroot/sites/ttter.syvak.com/storage
      - ../../.docker/dev/cron/crontabs:/etc/crontabs
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      dev-syvak-php-fpm:
        condition: service_started
      dev-syvak-mariadb:
        condition: service_healthy
    networks:
      - dev-syvak-net

  dev-syvak-nginx:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/nginx/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: www-data
    image: dev-syvak-nginx:1.0-alpine-slim
    container_name: dev-syvak-nginx
    restart: unless-stopped
    env_file:
      - ../../.docker/dev/env/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dev-syvak-nginx.rule=Host(`dev.syvak.com`)"
      - "traefik.http.routers.dev-syvak-nginx.entrypoints=web"
      - "traefik.http.services.dev-syvak-nginx.loadbalancer.server.port=80"
    volumes:
      - ../../app-code/app:/var/webroot/sites/ttter.syvak.com/app:ro
      - ../../app-code/httpdocs:/var/webroot/sites/ttter.syvak.com/httpdocs:ro
      - ../../app-code/storage:/var/webroot/sites/ttter.syvak.com/storage:ro
      - ../../.docker/dev/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    depends_on:
      - dev-syvak-php-fpm
    networks:
      - traefik-network
      - dev-syvak-net

  dev-syvak-mariadb:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/mariadb/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: mysql
    image: dev-syvak-mariadb:1.0
    container_name: dev-syvak-mariadb
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "3340:3306"
    env_file:
      - ../../.docker/dev/env/.env
      - ../../.docker/dev/env/.env.mariadb
    volumes:
      - ../../.db/mariadb:/var/lib/mysql
    security_opt:
      - no-new-privileges:true       # Disables setuid/setgid
      - apparmor=docker-default      # Limits syscalls and file system
    cap_drop:
      - ALL # Removes Linux capabilities
    networks:
      - dev-syvak-net

  dev-syvak-redis:
    build:
      context: ${PWD}
      dockerfile: .docker/dev/redis/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        UMASK: ${UMASK:-0002}
        USERNAME: redis
    image: dev-syvak-redis:1.0-alpine
    container_name: dev-syvak-redis
    restart: unless-stopped
    ports:
      - "42608:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - ../../.db/redis:/data
    init: true # Ensures proper signal handling and zombie reaping
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    cap_drop:
      - ALL # Removes Linux capabilities
    networks:
      - dev-syvak-net

  dev-syvak-kafka:
    image: apache/kafka:4.0.0
    container_name: dev-syvak-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://dev-syvak-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@dev-syvak-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - ../../.db/kafka:/var/lib/kafka/data
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    cap_drop:
      - ALL
    networks:
      - dev-syvak-net

networks:
  traefik-network:
    name: traefik-network
    driver: bridge
    external: true
  dev-syvak-net:
    name: dev-syvak-net
    driver: bridge
    external: true
